<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>純前端 AI 助理 (Groq 版)</title>
    <style>
        /* 全螢幕純黑背景 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
            background-color: #000000; 
            color: white; margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; 
        }

        /* 邊緣發光特效 */
        .edge-glow {
            position: fixed; top: -5px; left: -5px; right: -5px; bottom: -5px; 
            pointer-events: none; z-index: 999; opacity: 0;
            border: 35px solid transparent; 
            background: linear-gradient(60deg, #ff2a5f, #ff9900, #bf00ff, #0073ff, #00ffea, #ff2a5f);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            filter: blur(30px); transition: opacity 0.6s ease-in-out, filter 0.3s ease;
        }

        .edge-glow.standby { opacity: 0.15; animation: gradient-flow 6s ease infinite; }
        .edge-glow.listening { opacity: 1; filter: blur(20px); animation: gradient-flow 2s ease infinite, pulse-glow 1s infinite alternate; }
        .edge-glow.thinking { opacity: 0.6; animation: gradient-flow 1s ease infinite; }
        .edge-glow.speaking { opacity: 0.8; filter: blur(35px); animation: gradient-flow 4s ease infinite; }

        @keyframes gradient-flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes pulse-glow { 0% { transform: scale(0.99); } 100% { transform: scale(1.01); } }

        /* 對話區 */
        .chat-container {
            flex-grow: 1; width: 100%; max-width: 800px; margin: 0 auto;
            padding: 60px 30px 120px 30px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 24px; box-sizing: border-box; scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { display: none; }
        
        .message { max-width: 85%; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.6s forwards; opacity: 0; transform: translateY(15px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .user-msg { align-self: flex-end; font-size: 20px; color: rgba(255,255,255,0.5); text-align: right; }
        .ai-msg { align-self: flex-start; font-size: 26px; font-weight: 600; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        
        /* 控制區 */
        .controls {
            position: fixed; bottom: 0; left: 0; width: 100%; display: flex; flex-direction: column;
            align-items: center; padding-bottom: 30px; background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0) 100%); z-index: 20;
        }
        
        .settings { display: flex; gap: 8px; margin-bottom: 15px; align-items: center; opacity: 0.3; transition: 0.3s; }
        .settings:hover { opacity: 0.8; }
        .settings input { padding: 5px; border: none; background: transparent; color: white; font-size: 14px; width: 80px; border-bottom: 1px solid #555; text-align: center; outline: none; }

        .minimal-btn {
            padding: 12px 24px; border-radius: 30px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-size: 15px; backdrop-filter: blur(10px); cursor: pointer; transition: all 0.3s ease;
        }
        .minimal-btn:hover { background: rgba(255,255,255,0.2); }
        .minimal-btn.active { background: transparent; color: #888; border: 1px solid transparent; }
    </style>
</head>
<body>

    <div class="edge-glow" id="edgeGlow"></div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-msg">純網頁模式啟動。請點擊下方按鈕開始。</div>
    </div>

    <div class="controls">
        <div class="settings">
            <label for="wakeWordInput" style="font-size: 13px;">喚醒詞:</label>
            <input type="text" id="wakeWordInput" value="嘿電腦">
        </div>
        <button class="minimal-btn" id="toggleSystemBtn">啟動 AI 系統</button>
    </div>

    <script>
        // ⚠️ 警告：將 API Key 寫在前端是非常危險的，請勿將此檔案公開上傳！
        const GROQ_API_KEY = "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"; 
        
        const toggleSystemBtn = document.getElementById('toggleSystemBtn');
        const chatContainer = document.getElementById('chatContainer');
        const wakeWordInput = document.getElementById('wakeWordInput');
        const edgeGlow = document.getElementById('edgeGlow');

        let conversationHistory = [];
        let isSystemRunning = false;
        let isAwake = false;

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        function setGlowState(state) {
            edgeGlow.className = 'edge-glow ' + state;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) alert("請使用 Chrome 或 Edge 瀏覽器。");

        // 1. 喚醒詞監聽
        const wakeNode = new SpeechRecognition();
        wakeNode.lang = 'zh-TW'; wakeNode.continuous = true; wakeNode.interimResults = true;

        wakeNode.onresult = (event) => {
            if (isAwake) return;
            let currentText = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                currentText += event.results[i][0].transcript;
            }
            const targetWord = wakeWordInput.value.replace(/\s+/g, '').toLowerCase();
            const spokenWord = currentText.replace(/\s+/g, '').toLowerCase();

            if (spokenWord.includes(targetWord)) {
                wakeNode.stop();
                startCommandMode();
            }
        };

        wakeNode.onend = () => { if (isSystemRunning && !isAwake) try { wakeNode.start(); } catch(e) {} };

        // 2. 指令監聽與直接呼叫 Groq API
        const cmdNode = new SpeechRecognition();
        cmdNode.lang = 'zh-TW'; cmdNode.continuous = false; cmdNode.interimResults = false;

        cmdNode.onstart = () => { setGlowState('listening'); toggleSystemBtn.innerText = "我在聽..."; };

        cmdNode.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            appendMessage('user', userText);
            
            setGlowState('thinking');
            toggleSystemBtn.innerText = "思考中...";

            // 準備發送給 API 的訊息
            const systemPrompt = {
                role: "system", 
                content: "你是一個像 Siri 一樣的智能助理。回答要極簡、自然，使用繁體中文。絕對不要使用任何格式符號。"
            };
            conversationHistory.push({ role: "user", content: userText });
            const apiMessages = [systemPrompt, ...conversationHistory];

            try {
                // 直接從瀏覽器發送請求給 Groq
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "llama3-70b-8192",
                        messages: apiMessages,
                        max_tokens: 256
                    })
                });
                
                const data = await response.json();
                const aiText = data.choices[0].message.content;
                
                appendMessage('ai', aiText);
                conversationHistory.push({ role: "assistant", content: aiText });
                
                // 使用瀏覽器內建語音發聲
                speak(aiText);

            } catch (error) {
                appendMessage('ai', "連線錯誤，請檢查 API Key 或網路。");
                returnToStandby();
            }
        };

        cmdNode.onend = () => { if (!synth.speaking && isSystemRunning) returnToStandby(); };
        cmdNode.onerror = (event) => { if (event.error === 'no-speech') returnToStandby(); };

        // 3. 內建語音合成 (TTS)
        const synth = window.speechSynthesis;

        function speak(text) {
            if (synth.speaking) synth.cancel();
            
            // 嘗試尋找繁體中文語音
            const voices = synth.getVoices();
            const twVoice = voices.find(voice => voice.lang.includes('zh-TW') || voice.lang.includes('zh-HK')) || voices[0];
            
            const utterThis = new SpeechSynthesisUtterance(text);
            utterThis.voice = twVoice;
            utterThis.lang = 'zh-TW';
            utterThis.pitch = 1.1;
            utterThis.rate = 1.1;
            
            setGlowState('speaking');
            toggleSystemBtn.innerText = "說話中...";

            utterThis.onend = () => { returnToStandby(); };
            synth.speak(utterThis);
        }

        // 確保語音庫載入完成
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => synth.getVoices();
        }

        function startCommandMode() {
            isAwake = true;
            try { cmdNode.start(); } catch(e) {}
        }

        function returnToStandby() {
            if (!isSystemRunning) return;
            isAwake = false;
            setGlowState('standby');
            toggleSystemBtn.innerText = "等待喚醒: " + wakeWordInput.value;
            try { wakeNode.start(); } catch(e) {}
        }

        // 系統啟動/停止
        toggleSystemBtn.addEventListener('click', () => {
            if (isSystemRunning) {
                isSystemRunning = false; isAwake = false; wakeNode.stop(); cmdNode.stop();
                if(synth.speaking) synth.cancel();
                toggleSystemBtn.classList.remove('active');
                toggleSystemBtn.innerText = "啟動 AI 系統";
                setGlowState(''); 
            } else {
                isSystemRunning = true;
                toggleSystemBtn.classList.add('active');
                const unlockTTS = new SpeechSynthesisUtterance('');
                synth.speak(unlockTTS);
                returnToStandby();
            }
        });
    </script>
</body>
</html>
